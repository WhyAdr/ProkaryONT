# ==============================================================================
# pipeline.conf — Configuration for the bacterial ONT assembly pipeline
# ==============================================================================
# Usage: pass --config pipeline.conf to each numbered stage you invoke.
# There is no active master orchestrator; run Stages 1 through 5 explicitly.
#
# CLI flags override values set here.
# Lines starting with # are comments. Blank lines are ignored.
# ==============================================================================

# ==========================================
# MODULAR ASSEMBLY PIPELINE (Stages 1–4)
# ==========================================

# --- Required inputs ---------------------------------------------------------
input_fastq=input.fastq.gz
sequencing_summary=sequencing_summary.txt
pod5_dir=pod5_dir/
sample_name=MyBacteria

# --- Compute -----------------------------------------------------------------
threads=128
read_type=ont_r10

# --- Filtlong ----------------------------------------------------------------
filtlong_min_length=200
# Optional: retain only the top N percent according to Filtlong's ranking.
# Leave unset to omit Filtlong --keep_percent.
# filtlong_keep_percent=90

# --- Stage 1 QC Diagnostics — Fastcat, Porechop_ABI (scan), SNIKT (baseline)
# all run unconditionally once Stage 1 executes. No toggles: install
# fastcat, porechop_abi, and snikt.R, or don't run 01_qc_estimate.sh.

# --- SDUST / Fastcat lint ----------------------------------------------------
# Stage 1 always performs a diagnostic SDUST census with these shared T/W
# settings and --max-proportion 0.0. It does not modify reads. Review:
#   01_qc/fastcat_sdust/sdust_summary.tsv
#   01_qc/fastcat_sdust/sdust_fraction_hist.tsv
#   01_qc/fastcat_sdust/sdust_high_burden_reads.tsv
lint_threshold=20                    # SDUST T parameter (int, >0). Higher = less masking.
lint_window=64                       # SDUST window size W (int, >0).

# --- Preprocessing / trimming (Stage 2) ---------------------------------------
# Porechop_ABI adapter trimming (ab initio). NOTE: not barcode-aware by
# design — see comments in 01_qc_estimate.sh / 02_preprocess_filter.sh for
# the ab-initio side-effect caveat.
enable_porechopabi_trim=false

# Chopper end-trimming. Gate this on reviewing the Stage 1/Stage 2 SNIKT and
# Porechop_ABI diagnostics first — only enable if residual end-bias remains.
# This is a human-triage decision, not automated.
enable_chopper_trim=false
chopper_trim_approach=fixed-crop   # fixed-crop | trim-by-quality | best-read-segment | split-by-low-quality
chopper_headcrop=50
chopper_tailcrop=30
chopper_trim_cutoff=               # Q-score threshold required for all quality-aware trimming modes
chopper_split_window=1             # Min consecutive low-quality bases to split (only used for split-by-low-quality; default: 1)

# --- Stage 2 Fastcat lint filtering (Step 6b; optional) ---------------------
# After reviewing the Stage 1 SDUST distribution, enable this explicitly and
# choose the tolerated masked fraction. This is a human-triage decision.
enable_fastcat_lint=false            # Enable low-complexity filtering with Fastcat lint (SDUST).
lint_max_proportion=0.95             # Max tolerated masked fraction to keep read (float [0.0,1.0]).
                                     # Set to 0.50 for more aggressive complexity filtering.
# NOTE: fastcat fastq also supports built-in --dust filtering as a consolidated step.
# For modular architecture, Step 6b runs as a standalone filter.

# --- Autocycler assembly -----------------------------------------------------
subsampler=autocycler              # autocycler | rasusa
subsample_count=4
subsample_seed=0
# rasusa_coverage=60               # Optional; auto-calculated if unset
parallel_jobs=4
canu_parallel_jobs=2
# Select directly with Stage 3 --assemblers LIST, or set this lowercase key.
# Canonical helpers: flye,canu,hifiasm,ilesta,lja,raven,miniasm,metamdbg,
# myloasm,plassembler,nextdenovo,redbean,necat. wtdbg2 is accepted as a
# compatibility alias and normalized to redbean.
# assemblers=flye,canu,hifiasm,ilesta,lja,raven,miniasm,metamdbg,myloasm,plassembler,nextdenovo,redbean,necat
# Uncomment to override genome size (skip re-estimation on filtered reads):
# genome_size_override=5000000
# Uncomment to change min subset read depth (default: 25):
# min_read_depth=25

# Minimum relative read depth for accepted assemblies (default: 0.1 = 10%).
# Subsamples with fewer bases than genome_size × min_depth_rel are rejected.
# Lower values tolerate sparser subsamples but may yield fragmented assemblies.
# Raise for high-coverage datasets; lower for metagenomic or low-input runs.
# min_depth_rel=0.1

# Assembler extra arguments (pass options directly to individual assemblers):
# flye_extra_args=
# raven_extra_args=
# plassembler_extra_args=
# hifiasm_extra_args=
# canu_extra_args=
# ilesta_extra_args=
# lja_extra_args=
# redbean_extra_args=
# Legacy fallback if redbean_extra_args is unset:
# wtdbg2_extra_args=

# --- Autocycler compress/combine ---------------------------------------------
# Both operations are capped at 100 threads by current upstream Autocycler.
# autocycler_compress_threads=100
# autocycler_combine_threads=100
# autocycler_combine_reads=/path/to/depth_annotation_reads.fastq.gz
autocycler_combine_depth_kmer=19

# --- Post-assembly contig assessment ----------------------------------------
# Autocycler's --max_contigs checks the mean contigs per input assembly.
# Leave this unset to retain the guarded upstream default of 25. If the
# prepared mean remains above 25, Stage 3 stops and reports the minimum explicit
# override rather than silently raising the guard.
# autocycler_max_contigs=

# Every valid assembly is counted, but minimap2 containment assessment runs
# only when an individual raw assembly has more than this many contigs.
dedup_trigger_contigs=25
dedup_min_cov=0.99
dedup_min_identity=0.99
# Zero disables length-only removal, protecting short replicon candidates.
dedup_min_len=0
# Defaults to min(global threads, 16) when unset.
# dedup_threads=16
# When true, fragmented assemblies are counted and copied without containment
# removal. Original assemblies/ FASTAs are always preserved regardless.
skip_contained_dedup=false

# Successful self-alignment PAFs are deleted after TSV/report reconciliation.
# Per-contig event TSVs, minimap2/dedup logs, settings, versions, and checksums
# remain under assembly_assessment/.

# --- PLSDB characterization --------------------------------------------------
# Required unless skip_plsdb_screen=true or PLASSEMBLER_DB is a valid directory.
# plassembler_db=/path/to/plassembler_db
skip_plsdb_screen=false

# --- Dorado polishing --------------------------------------------------------
dorado_model=sup
dorado_min_qscore=7
# Optional; passed only to dorado polish, not basecaller or aligner.
# dorado_polish_device=cuda:0,1,2,3

# Uncomment to run a second Dorado polish pass after Dnaapler reorientation.
# This improves accuracy at the old linearisation breakpoint (~1-5 errors),
# where reads previously soft-clipped at contig boundaries now map contiguously.
# Doubles GPU polishing time. Recommended for publication-quality assemblies.
# double_polish=true

# Uncomment to remove intermediate BAM files after polishing:
# cleanup_bam=true

# --- Behaviour ---------------------------------------------------------------
# Uncomment to skip manual curation pauses:
# skip_curation=true

# ==========================================
# TAXONOMY (Stage 5, invoked manually)
# ==========================================
# Run after reviewing the Stage 4 final assembly.

# --- Database ----------------------------------------------------------------
gtdbtk_data_path=/path/to/gtdbtk_db

# The former master orchestration and annotation stack are retained under
# archived/ for historical reference and are not part of the active workflow.
